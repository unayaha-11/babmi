:root{--bg:#FFFFFF;--ink:#111111;--muted:#5A5A5A;--line:#E6E6E6;--fill:#F2F2F2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:48px 24px 96px}
h1,h2,h3,p{margin:0}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:12px}
.hero{visibility:hidden}
.ready .hero{visibility:visible}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;background:#FFFFFF;padding:36px 0 32px}
.circle{border:3px solid #111111;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#FFFFFF}
.circle img{width:100%;height:100%;object-fit:cover;display:block}
.avatar{width:min(34vw,128px);aspect-ratio:1;font-size:2.6rem;font-weight:900;border-width:1.5px;background:var(--fill)}
h1{font-family:"Pencerio","Noto Sans KR",system-ui,sans-serif;font-synthesis:none;font-size:clamp(2.6rem,11vw,3.6rem);font-weight:50;letter-spacing:.01em;line-height:1.2;margin-top:24px}
.tool-label{margin-top:6px;font-size:.8rem;font-weight:500;letter-spacing:.08em;color:var(--muted)}
.role{font-size:1.05rem;font-weight:500;letter-spacing:.02em;margin-top:2px}
.bio{color:var(--muted);margin-top:14px;max-width:34ch;font-size:.95rem}
.platforms{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;list-style:none;margin:28px 0 0;padding:0}
.platforms a{display:grid;place-items:center;width:48px;height:48px;border:0;background:var(--fill);color:#111111;text-decoration:none;font-weight:900;font-size:.95rem;transition:transform .15s}
.platforms a:hover{transform:scale(1.08)}
.avatar img,.platforms a img{opacity:0;transition:opacity .35s}
.avatar img.on,.platforms a img.on{opacity:1}
/* 첫 진입 애니메이션: 사진 → 이름(좌→우 필기) → 사용 툴 → 소개 → 플랫폼 */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes write{
  0%{opacity:0;clip-path:inset(-25% 100% -25% 0);transform:translateX(-10px)}
  6%{opacity:1}
  100%{opacity:1;clip-path:inset(-25% -2% -25% 0);transform:none}
}
.ready .avatar{animation:rise .8s ease-out .1s both}
.ready .hero h1{animation:write 1.5s cubic-bezier(.45,.05,.3,1) .7s both}
.ready .tool-label{animation:rise .7s ease-out 2.0s both}
.ready .role{animation:rise .7s ease-out 2.15s both}
.ready .bio{animation:rise .7s ease-out 2.4s both}
.ready .platforms{animation:rise .7s ease-out 2.7s both}
section{margin-top:72px}
h2{font-size:1.1rem;font-weight:900;margin-bottom:14px}
.works{list-style:none;margin:0 -24px;padding:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.works::-webkit-scrollbar{display:none}
.works li{flex:0 0 100%;scroll-snap-align:start}
.banner{display:block;aspect-ratio:1;position:relative;overflow:hidden;background:var(--fill);text-decoration:none}
.banner img{display:block;width:100%;height:100%;object-fit:cover}
.dots{display:flex;justify-content:center;gap:8px;margin-top:14px}
.dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:rgba(17,17,17,.25);cursor:pointer}
.dots button[aria-current="true"]{background:#111111}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;list-style:none;margin:0;padding:0}
.tile{display:flex;align-items:flex-end;aspect-ratio:3/4;border-radius:16px;padding:12px 14px;text-decoration:none;font-weight:500;font-size:.95rem;line-height:1.4;background:var(--fill);position:relative;overflow:hidden;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.hasimg span{position:relative;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.55)}
.more{display:block;margin-top:18px;text-align:center;font-weight:500;padding:12px;border:3px solid #111111;border-radius:999px;text-decoration:none;transition:background .15s,color .15s}
.more:hover{background:#111111;color:#FFFFFF}
footer{margin-top:64px;text-align:center;color:var(--muted);font-size:.9rem}
.adminlink{display:inline-block;margin-top:10px;font-size:.8rem;color:var(--muted)}
@media (min-width:560px){.gallery{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important;animation:none!important}}

/* admin */
#admin{position:fixed;inset:0;z-index:50;background:#fff;color:#111;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#admin[hidden]{display:none}
.adm{max-width:560px;margin:0 auto;padding:0 24px 80px}
.admtop{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;padding:14px 0;border-bottom:1px solid var(--line);z-index:1}
#adStatus{min-height:1.7em;font-size:.9rem;color:var(--muted);margin:10px 0 0}
#adStatus.err{color:#C0262D}
.adm h3{font-size:1.05rem;font-weight:900;margin:32px 0 10px}
.f{display:grid;gap:4px;margin-bottom:12px;font-size:.9rem}
.f input,.f textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid #111;border-radius:12px;background:#fff;color:#111}
.f textarea{min-height:84px;resize:vertical}
.f input[type=file]{border:0;padding:4px 0;font-size:.85rem}
.thumbbox{display:grid;place-items:center;min-height:72px;border:2px dashed var(--line);border-radius:12px;background:var(--fill);overflow:hidden}
.thumbbox img{display:block;max-width:100%;max-height:140px;object-fit:contain}
.thumbbox small{color:var(--muted)}
.item{border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:500;padding:8px 16px;border:2px solid #111;border-radius:999px;background:#fff;color:#111;cursor:pointer}
.btn.pri{background:#111;color:#fff}
.btn.del{border-color:#C0262D;color:#C0262D}
</style>
<noscript><style>.hero{visibility:visible}</style></noscript>
</head>
<body>
<main>
  <header class="hero">
    <div class="circle avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <p class="tool-label">Use Tool</p>
    <p class="role" id="role"></p>
    <p class="bio" id="bio"></p>
    <ul class="platforms" id="platforms"></ul>
  </header>
  <section aria-labelledby="h-works">
    <h2 id="h-works">Launched Works</h2>
    <ul class="works" id="works"></ul>
    <div class="dots" id="dots"></div>
  </section>
  <section aria-labelledby="h-gal">
    <h2 id="h-gal">Personal Portfolio</h2>
    <ul class="gallery" id="gallery"></ul>
    <a class="more" id="more">전체 작업 보러 가기</a>
  </section>
  <footer>
    <div id="contact"></div>
    <a class="adminlink" href="#admin" id="adminLink">관리자</a>
  </footer>
</main>

<div id="admin" hidden role="dialog" aria-label="관리자"><div class="adm" id="admBody"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
/* ====== 1. Supabase 연결 정보 (Project Settings → API) ====== */
const SUPABASE_URL = "https://qzemkdwcwhowtuajzvtb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Wd1ntTu7Lm-Av_P0DjGPdQ_DqCyCpw0";   // publishable(공개용) 키만 넣으세요. secret / service_role 키는 절대 넣지 마세요
/* ============================================================ */

const DEFAULT = {
  name: "Babmi", role: "NAI · CLIP STUDIO PAINT", avatar: "",
  bio: "AI 일러스트와 캐릭터 챗봇을 만들어요. 한 줄 소개를 적어 주세요.",
  contact: "you@example.com",
  platforms: [1,2,3,4,5].map(n => ({name:"플랫폼 " + n, url:"#", icon:""})),
  works: [1,2,3].map(n => ({title:"작품 " + n, url:"#", img:""})),
  gallery: [1,2,3,4].map(n => ({title:"이미지 시리즈 " + n, url:"#", img:""})),
  allWorksUrl: "#"
};
let data = structuredClone(DEFAULT);
const configured = !SUPABASE_URL.startsWith("YOUR_");
const sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x) e.textContent = x; return e; };
const safeUrl = u => /^(https?:\/\/|\/|#)/.test(u || "") ? u : "#";
const link = (a, u) => { u = safeUrl(u); a.href = u; if (u !== "#") { a.target = "_blank"; a.rel = "noopener"; } return a; };
const fav = u => { try { const h = new URL(u); return /^https?:$/.test(h.protocol) ? "https://www.google.com/s2/favicons?sz=128&domain_url=" + encodeURIComponent(h.origin) : ""; } catch (e) { return ""; } };
const pic = (src, alt, eager) => { const i = el("img"); i.src = /^(https?:\/\/|\/)/.test(src) ? src : ""; i.alt = alt || ""; i.loading = eager ? "eager" : "lazy"; return i; };
const reveal = im => { const on = () => im.classList.add("on"); if (im.complete && im.naturalWidth) on(); else im.addEventListener("load", on, {once: true}); };
let rendered = false;

/* ---------- 공개 화면 ---------- */
function render() {
  document.title = data.name + " · Portfolio";
  $("name").textContent = data.name; $("role").textContent = data.role; $("bio").textContent = data.bio;
  rendered = true;
  const av = $("avatar"), initial = (data.name || "").charAt(0); av.replaceChildren();
  if (data.avatar) { const im = pic(data.avatar, data.name + " 프로필 사진", true); im.onerror = () => { av.replaceChildren(); av.textContent = initial; }; av.appendChild(im); reveal(im); } else av.textContent = initial;

  $("platforms").replaceChildren();
  data.platforms.forEach(p => {
    const li = el("li"), a = link(el("a", "circle"), p.url);
    a.setAttribute("aria-label", p.name); a.title = p.name;
    const letter = () => { a.replaceChildren(); a.textContent = (p.name || "?").charAt(0); };
    const src = p.icon || fav(p.url);   // 직접 올린 아이콘이 있으면 우선, 없으면 링크 사이트의 파비콘
    if (src) { const im = pic(src, "", true); im.onerror = letter; a.appendChild(im); reveal(im); } else letter();
    li.appendChild(a); $("platforms").appendChild(li);
  });

  $("works").replaceChildren(); $("dots").replaceChildren();
  data.works.forEach((w, i) => {
    const li = el("li"), a = link(el("a", "banner"), w.url);
    a.setAttribute("aria-label", w.title); if (w.img) a.appendChild(pic(w.img, w.title));
    li.appendChild(a); $("works").appendChild(li);
    const b = el("button"); b.type = "button"; b.setAttribute("aria-label", (i + 1) + "번째 작품");
    b.onclick = () => $("works").scrollTo({left: i * $("works").clientWidth, behavior: "smooth"});
    $("dots").appendChild(b);
  });
  syncDots();

  $("gallery").replaceChildren();
  data.gallery.forEach(g => {
    const li = el("li"), a = link(el("a", "tile" + (g.img ? " hasimg" : "")), g.url);
    if (g.img) a.appendChild(pic(g.img, g.title));
    a.appendChild(el("span", "", g.title)); li.appendChild(a); $("gallery").appendChild(li);
  });
  link($("more"), data.allWorksUrl);
  $("contact").textContent = "문의 " + data.contact;
}
function syncDots() {
  const ws = $("works"), i = Math.round(ws.scrollLeft / (ws.clientWidth || 1));
  [...$("dots").children].forEach((b, k) => b.setAttribute("aria-current", String(k === i)));
}
$("works").addEventListener("scroll", syncDots, {passive: true});

async function load() {
  if (!sb) return;
  try {
    const {data: row} = await sb.from("site_content").select("data").eq("id", 1).maybeSingle();
    if (row && row.data && Object.keys(row.data).length) data = {...DEFAULT, ...row.data};
  } catch (e) { console.error(e); }
  render();
}

/* ---------- 관리자 ---------- */
const status = (msg, err) => { const s = $("adStatus"); if (s) { s.textContent = msg; s.className = err ? "err" : ""; } };
const LISTS = {
  platforms: {title: "활동 플랫폼", blank: {name: "", url: "", icon: ""},
    fields: [["name", "플랫폼 이름"], ["url", "내 프로필 링크"], ["icon", "아이콘 이미지 (선택 · 비워 두면 링크 사이트의 파비콘이 자동으로 표시돼요)", "img"]]},
  works: {title: "런칭 작품 (정사각형 배너)", blank: {title: "", url: "", img: ""},
    fields: [["title", "작품명 (화면에는 안 보이고 접근성용)"], ["url", "상세 페이지 주소"], ["img", "배너 이미지", "img"]]},
  gallery: {title: "개인 제작 포트폴리오", blank: {title: "", url: "", img: ""},
    fields: [["title", "제목"], ["url", "링크 주소"], ["img", "썸네일 이미지", "img"]]}
};

async function upload(file) {
  const ext = (file.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "");
  const path = crypto.randomUUID() + "." + ext;
  const {error} = await sb.storage.from("portfolio").upload(path, file, {cacheControl: "31536000", contentType: file.type});
  if (error) throw error;
  return sb.storage.from("portfolio").getPublicUrl(path).data.publicUrl;
}

function field(parent, obj, key, label, kind) {
  if (kind === "img") { imgField(parent, obj, key, label); return; }
  const w = el("label", "f"); w.appendChild(el("span", "", label));
  const i = el(kind === "area" ? "textarea" : "input"); i.value = obj[key] || "";
  i.oninput = () => { obj[key] = i.value; };
  w.appendChild(i);
  parent.appendChild(w);
}

/* 이미지는 외부 링크 입력 없이 파일 업로드만 가능 */
function imgField(parent, obj, key, label) {
  const w = el("div", "f"); w.appendChild(el("span", "", label));
  const prev = el("div", "thumbbox"), show = () => {
    prev.replaceChildren();
    if (obj[key]) prev.appendChild(pic(obj[key], "")); else prev.appendChild(el("small", "", "등록된 이미지 없음"));
  };
  show(); w.appendChild(prev);
  const f = el("input"); f.type = "file"; f.accept = "image/*";
  f.onchange = async () => {
    const file = f.files[0]; if (!file) return;
    if (!file.type.startsWith("image/")) { status("이미지 파일만 올릴 수 있어요.", true); f.value = ""; return; }
    if (file.size > 10 * 1024 * 1024) { status("10MB 이하의 이미지만 올릴 수 있어요.", true); f.value = ""; return; }
    status("이미지 올리는 중…");
    try { obj[key] = await upload(file); show(); status("이미지를 올렸어요. 맨 위 ‘저장’을 눌러 주세요."); }
    catch (e) { status("이미지 업로드 실패: " + e.message, true); }
    f.value = "";
  };
  w.appendChild(f);
  if (obj[key]) w.appendChild(btn("이미지 지우기", "del", () => { obj[key] = ""; show(); status("이미지를 지웠어요. 맨 위 ‘저장’을 눌러 주세요."); }));
  parent.appendChild(w);
}

function shell(title) {
  const b = $("admBody"); b.replaceChildren();
  const top = el("div", "admtop"); top.appendChild(el("strong", "", title));
  const bar = el("div", "row"); top.appendChild(bar); b.appendChild(top);
  const st = el("p"); st.id = "adStatus"; st.setAttribute("role", "status"); b.appendChild(st);
  return {b, bar};
}
const btn = (label, cls, fn) => { const x = el("button", "btn " + (cls || ""), label); x.type = "button"; x.onclick = fn; return x; };

function buildLogin(msg) {
  const {b, bar} = shell("관리자 로그인");
  bar.appendChild(btn("닫기", "", closeAdmin));
  if (msg) status(msg, true);
  const form = el("form"); form.style.marginTop = "20px";
  const e = {email: "", password: ""};
  field(form, e, "email", "이메일"); field(form, e, "password", "비밀번호");
  form.querySelectorAll("input")[1].type = "password";
  form.querySelectorAll("input")[0].type = "email";
  const go = el("button", "btn pri", "로그인"); go.type = "submit"; form.appendChild(go);
  form.onsubmit = async ev => {
    ev.preventDefault(); status("로그인 중…");
    const {error} = await sb.auth.signInWithPassword({email: e.email, password: e.password});
    if (error) status("로그인 실패: " + error.message, true); else buildAdmin();
  };
  b.appendChild(form);
}

function buildAdmin() {
  const {b, bar} = shell("관리자");
  bar.append(btn("저장", "pri", save), btn("로그아웃", "", async () => { await sb.auth.signOut(); buildLogin(); }), btn("닫기", "", closeAdmin));

  b.appendChild(el("h3", "", "프로필"));
  field(b, data, "avatar", "프로필 사진", "img");
  field(b, data, "name", "필명"); field(b, data, "role", "사용 툴 (Use Tool 아래 표시)");
  field(b, data, "bio", "한 줄 소개", "area"); field(b, data, "contact", "문의 이메일");

  Object.entries(LISTS).forEach(([key, cfg]) => {
    b.appendChild(el("h3", "", cfg.title));
    const arr = data[key];
    arr.forEach((it, idx) => {
      const box = el("div", "item");
      cfg.fields.forEach(([k, label, kind]) => field(box, it, k, label, kind));
      const r = el("div", "row");
      const move = d => () => { const j = idx + d; if (j < 0 || j >= arr.length) return; [arr[idx], arr[j]] = [arr[j], arr[idx]]; buildAdmin(); };
      r.append(btn("↑", "", move(-1)), btn("↓", "", move(1)), btn("삭제", "del", () => { arr.splice(idx, 1); buildAdmin(); }));
      box.appendChild(r); b.appendChild(box);
    });
    b.appendChild(btn("+ 추가", "", () => { arr.push({...cfg.blank}); buildAdmin(); }));
  });
  b.appendChild(el("h3", "", "전체 작업 링크"));
  field(b, data, "allWorksUrl", "‘전체 작업 보러 가기’ 버튼 주소");
}

async function save() {
  status("저장 중…");
  const {error} = await sb.from("site_content").upsert({id: 1, data, updated_at: new Date().toISOString()});
  if (error) status("저장 실패: " + error.message, true); else { status("저장했어요."); render(); }
}

async function openAdmin() {
  $("admin").hidden = false; document.body.style.overflow = "hidden";
  if (!sb) { const {b, bar} = shell("관리자"); bar.appendChild(btn("닫기", "", closeAdmin)); status("index.html 위쪽의 SUPABASE_URL과 SUPABASE_ANON_KEY를 먼저 입력해 주세요.", true); return; }
  const {data: {session}} = await sb.auth.getSession();
  session ? buildAdmin() : buildLogin();
}
function closeAdmin() {
  $("admin").hidden = true; document.body.style.overflow = ""; render();
  if (location.hash === "#admin") history.replaceState(null, "", location.pathname + location.search);
}
$("adminLink").addEventListener("click", e => { e.preventDefault(); openAdmin(); });
if (location.hash === "#admin") openAdmin();

/* 데이터와 프로필 사진이 준비된 뒤에 한 번에 보여주고 애니메이션 시작 */
const avatarReady = () => new Promise(res => {
  const im = $("avatar").querySelector("img");
  if (!im || (im.complete && im.naturalWidth)) return res();
  im.addEventListener("load", res, {once: true}); im.addEventListener("error", res, {once: true});
  setTimeout(res, 2500);
});
(async function boot() {
  if (sb) await Promise.race([load(), new Promise(r => setTimeout(r, 3500))]);
  if (!rendered) render();
  await avatarReady();
  document.documentElement.classList.add("ready");
})();
</script>
</body>
</html>
